name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:ci.db
      LOG_LEVEL: silent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database
        run: bun run db:push

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
